</script>
<script>
'use strict';
const REC=JSON.parse(document.getElementById('recdata').textContent);
const META=REC.meta, FRAMES=REC.frames, TPD=META.ticks_per_day, DPY=META.days_per_year;
const NAMES={}; META.agents.forEach(a=>NAMES[a.id]=a.name);

const TW=32, TH=16, ROWSN=META.terrain.length, COLSN=META.terrain[0].length;
const OX=ROWSN*TW/2, WW=(COLSN+ROWSN)*TW/2, WH=(COLSN+ROWSN)*TH/2+76, TOP=58;
const world=document.createElement('canvas'); world.width=WW; world.height=WH;
const g=world.getContext('2d'); g.imageSmoothingEnabled=false;
const cv=document.getElementById('cv'), stage=document.getElementById('stage');
const vg=cv.getContext('2d');

const hash=(x,y)=>{let h=(x*374761393+y*668265263)^2654435761;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;};
const isoX=(c,r)=>OX+(c-r)*TW/2, isoY=(c,r)=>TOP+(c+r)*TH/2;
function px(x,y,col){g.fillStyle=col;g.fillRect(x,y,1,1);}

// ---------- indexes over the recording ----------
const clearedAt={}, rainDays=new Set(), builtAt=[], bornAt={}, dayEnd={}, FEED=[];
for(const f of FRAMES) for(const e of f.events){
  if(e.type==='plot_cleared') clearedAt[e.plot]=f.t;
  else if(e.type==='weather') rainDays.add(Math.floor(f.t/TPD));
  else if(e.type==='house_built') builtAt.push([f.t,e.site]);
  else if(e.type==='birth') bornAt[e.child]=f.t;
  else if(e.type==='day_end') (dayEnd[e.agent]=dayEnd[e.agent]||[]).push([f.t,e.health,e.rice,e.meals,e.age]);
  if(['founded','dispute','plot_claimed','plot_cleared','gift','refused_food','death','stopped',
      'paired','birth','came_of_age','festival','house_built'].includes(e.type)) FEED.push([f.t,e]);
}
const plotTiles={}; META.plots.forEach(p=>plotTiles[p.x+','+p.y]=p);
const baseHomes=new Set(META.homes.map(h=>h[0]+','+h[1]));
const ADULT_TICKS=14*DPY*TPD;
const SEASONS=[['Sowing',0],['Sowing',0],['Sowing',0],['Growing',1],['Growing',1],['Growing',1],['Harvest',2],['Harvest',2]];

// ---------- ground ----------
const PAL={
  W:['#39698A','#4A7A9B','#7FAECB'], K:['#C4B285','#B3A276'],
  T:['#C8AC74','#B89A60'], G:['#83A051','#79964A','#8DA85C'], D:['#B99A6B','#AD8F60']
};
// paddy through the year: wet sown mud -> young green -> deep green -> gold
const CROP=[
  {base:'#6E5F44', row:'#7A9A50', alt:'#6E8A46', rows:6},   // sowing: mud, sparse seedlings
  {base:'#527D5E', row:'#8DBE5E', alt:'#75A64C', rows:4},   // growing: the familiar green
  {base:'#8A7A46', row:'#D8BC55', alt:'#C9A845', rows:3},   // harvest: gold
];
function cropStage(day){return SEASONS[day%DPY][1];}
function tileColor(k,x,y,dy,t,day,good){
  if(k==='W'){
    let col=(hash(x>>3,y>>2)<.5)?PAL.W[0]:PAL.W[1];
    if(y%5===2&&((x+Math.floor(t*10))%44)<7) col=PAL.W[2];
    return col;
  }
  if(k==='P'||k==='Q'){
    const c=CROP[cropStage(day)], step=good?Math.max(2,c.rows-1):c.rows;
    if(dy%step===1||(good&&dy%step===2)) return (x>>1)%2?c.row:c.alt;
    if(cropStage(day)===0&&hash(x,y)<.06) return c.row;         // scattered seedlings
    return c.base;
  }
  const p=PAL[k]||PAL.G;
  if(k==='G'){ if(hash(x,y)>.985) return p[2]; return hash(x>>3,y>>3)<.4?p[1]:p[0]; }
  return hash(x>>2,y>>2)<.25?p[1]:p[0];
}
function drawGround(t,tid){
  const day=Math.floor(tid/TPD);
  for(let r=0;r<ROWSN;r++)for(let c=0;c<COLSN;c++){
    let k=META.terrain[r][c]; if(k==='B') k='G';
    const pl=plotTiles[c+','+r];
    let good=k==='Q';
    if(pl&&k==='G'&&(clearedAt[pl.id]===undefined||clearedAt[pl.id]<=tid)) k='P';
    const cx=isoX(c,r),cy=isoY(c,r);
    for(let dy=0;dy<TH;dy++){
      const w=dy<TH/2?(dy+1)*4:(TH-dy)*4, x0=cx-w/2;
      for(let dx=0;dx<w;dx++){
        const x=x0+dx,y=cy+dy;
        px(x,y,tileColor(k==='Q'?'P':k,x,y,dy,t,day,good));
      }
    }
    if(k==='P'||k==='Q'){
      g.fillStyle='#8A7A4A';
      if(hash(c,r)<.7){g.fillRect(cx-2,cy,4,1);g.fillRect(cx+6,cy+2,3,1);}
    }
  }
}

// ---------- sprites ----------
const SK='#9A6540',HR='#241B12',OUT='#221A10';
function prerender(rows,pal){
  const h=rows.length,w=rows[0].length;
  const c=document.createElement('canvas'); c.width=(w+2)*2; c.height=(h+2)*2;
  const cg=c.getContext('2d');
  const set=(i,j)=>rows[j]&&rows[j][i]&&rows[j][i]!=='.';
  for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){
    if(!set(i,j)&&(set(i-1,j)||set(i+1,j)||set(i,j-1)||set(i,j+1))){
      cg.fillStyle=OUT;cg.fillRect((i+1)*2,(j+1)*2,2,2);
    }
  }
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const ch=rows[j][i]; if(ch==='.'||!pal[ch]) continue;
    cg.fillStyle=pal[ch];cg.fillRect((i+1)*2,(j+1)*2,2,2);
  }
  return c;
}
function manSet(turban,dhoti){
  const pal={O:turban,K:SK,W:dhoti};
  const stand=prerender([
  '....OOOO....','...OOOOOO...','....KKKK....','....KKKK....','.....KK.....',
  '...KKKKKK...','..KKKKKKKK..','..KK.KK.KK..','..K..WW..K..','.....WWWW...',
  '...WWWWWW...','...WWWWWW...','...WWWWWW...','...WW..WW...','...WW..WW...','...KK..KK...'],pal);
  const walk=prerender([
  '....OOOO....','...OOOOOO...','....KKKK....','....KKKK....','.....KK.....',
  '...KKKKKK...','..KKKKKKKK..','..KK.KK.KK..','..K..WW..K..','.....WWWW...',
  '...WWWWWW...','...WWWWWW...','...WWWWWW...','..WW....WW..','..WW....WW..','..KK....KK..'],pal);
  const bent=prerender([
  '............','............','.....OOOO...','....OOOOOO..','...KKKKKK.hh',
  '..KKKKKKKKhh','..KK.KKKK.hh','.....WWWW.hh','....WWWWW.BB','....WWWW..BB',
  '....WW.WW...','....WW.WW...','....KK.KK...'],{...pal,h:'#6E5138',B:'#8A8A88'});
  return {stand,walk,bent};
}
function womanSet(col,dark){
  const pal={H:HR,K:SK,R:col,r:dark};
  const stand=prerender([
  '....HHHH....','...HHHHHH...','....HHHH....','....KKKK....','....KKKK....',
  '...RRRRRR...','..KRRRRRRK..','..KRRRRRRK..','...RRRRRR...','...RRRRRR...',
  '...RrRRrR...','...RRRRRR...','...RRRRRR...','...RRRRRR...','....KK.KK...','....KK.KK...'],pal);
  const walk=prerender([
  '....HHHH....','...HHHHHH...','....HHHH....','....KKKK....','....KKKK....',
  '...RRRRRR...','..KRRRRRRK..','..KRRRRRRK..','...RRRRRR...','...RRRRRR...',
  '...RrRRrR...','...RRRRRR...','...RRRRRR...','...RRRRRR...','...KK.......','.......KK...'],pal);
  const bent=prerender([
  '............','............','.....HHHH...','....HHHHHH..','...KKKKKK.hh',
  '..RRRRRRRRhh','..RR.RRRR.hh','.....RRRR.hh','....RRRRR.BB','....RRRR..BB',
  '....RR.RR...','....RR.RR...','....KK.KK...'],{...pal,h:'#6E5138',B:'#8A8A88'});
  return {stand,walk,bent};
}
const childImg=prerender([
'...HHHH...','...SSSS...','...SSSS...','..CCCCCC..','..CCCCCC..',
'..CC..CC..','..KK..KK..'],{H:HR,S:SK,C:'#D08A3E',K:'#7A4A2C'});
function cowPair(body,shade){
  const up=prerender([
  '......BBBBBBBBBBBB.hh','....BBBBBBBBBBBBBBBhh','...BBBBbbBBBBBBBBhhhh','..BBBBBbbBBBBBBBBheeh','..BBBBBBBBBBBBBBBhhhh',
  '..BBBBBBBBBBBBBBB.hh.','...BB..BB....BB..BB..','...BB..BB....BB..BB..'],{B:body,b:shade,h:'#D8D2C2',e:HR});
  const down=prerender([
  '......BBBBBBBBBBBB...','....BBBBBBBBBBBBBBB..','...BBBBbbBBBBBBBBBB..','..BBBBBbbBBBBBBBBhh..','..BBBBBBBBBBBBBBBhhh.',
  '..BBBBBBBBBBBBBBBheeh','...BB..BB....BB..hhh.','...BB..BB....BB......'],{B:body,b:shade,h:'#D8D2C2',e:HR});
  return [up,down];
}
const cows=[cowPair('#EDE8DA','#8A6242'),cowPair('#7A5638','#5E4228'),cowPair('#D8CDB8','#6E5138')];
const henImg=prerender([
'..RR..','.WWWW.','WWWWWW','.WWWW.','..Y...'],{R:'#C0392B',W:'#EDE8DA',Y:'#D8A020'});

const MAN_KITS=[['#D08A3E','#EDE8DA'],['#B04A3A','#EDE8DA'],['#5A7A9A','#E4DDC8'],['#6E8A3A','#EDE8DA'],['#8A5A9A','#E4DDC8'],['#3A8A7A','#EDE8DA']];
const WOMAN_KITS=[['#B03A60','#842B48'],['#2E7A72','#215B55'],['#C9803A','#96601E'],['#6A4A9A','#4E3372'],['#3A6AA0','#2A4E78'],['#A83A3A','#7E2B2B']];
const KITS={};
{ let mi=0, wi=0;
  META.agents.forEach(a=>{
    KITS[a.id]=a.sex==='f'?womanSet(...WOMAN_KITS[wi++%WOMAN_KITS.length])
                          :manSet(...MAN_KITS[mi++%MAN_KITS.length]);
  });
}

// ---------- buildings ----------
let nightGlow=0; const doors=[];
function house(bx,by,o){
  o=o||{}; const bw=o.w||42,bh=20;
  for(let j=0;j<bh;j++)for(let i=0;i<bw;i++){
    const shade=i<9,h=hash(bx+i,by+j);
    px(bx+i,by+j, shade?(h<.12?'#8A6742':'#96714A'):(h<.08?'#C8A272':'#B08A5A'));
  }
  g.fillStyle='#7A5A38';g.fillRect(bx-1,by+bh-2,bw+2,2);
  const roofH=o.thatch?14:17;
  for(let j=0;j<roofH;j++){
    const inset=Math.max(0,roofH-3-j)|0;
    for(let i=bx-5+inset;i<bx+bw+5-inset;i++){
      const h=hash(i,by-roofH+j);
      px(i,by-roofH+j,o.thatch?(h<.12?'#A8863E':(j%4===3?'#B99A50':'#C9A85C'))
                              :((j%3===0)?'#7E3320':(h<.15?'#C05B3B':'#A6472E')));
    }
  }
  g.fillStyle=o.thatch?'#8A6D34':'#6E2C1C';g.fillRect(bx-6,by-2,bw+12,2);
  const dx=bx+(o.doorRight?bw-15:9);
  g.fillStyle='#3A2A1C';g.fillRect(dx,by+4,10,bh-6);
  g.fillStyle=nightGlow>0.4?'#FFC46A':'#241B12';g.fillRect(dx+1,by+5,8,bh-8);
  const wx=bx+(o.doorRight?9:bw-16);
  g.fillStyle='#3A2A1C';g.fillRect(wx,by+6,8,6);
  g.fillStyle=nightGlow>0.4?'#FFCF7A':'#1A1410';g.fillRect(wx+1,by+7,6,4);
  doors.push([dx+5,by+bh]);
}
function banyan(bx,by){
  g.fillStyle='rgba(30,40,20,0.30)';
  g.beginPath();g.ellipse(bx+4,by+6,44,12,0,0,7);g.fill();
  for(let j=0;j<6;j++)for(let i=-16;i<24;i++)
    if(Math.abs(i-4)+j*2<24){const h=hash(bx+i,by+j);px(bx+i,by+j-2,h<.3?'#9A9484':'#B0AA98');}
  for(const off of [0,7]) for(let j=0;j<20;j++)for(let i=0;i<7;i++){
    const spread=j>15?(j-15):0;
    if(i>=2-spread&&i<=4+spread){const h=hash(bx+off+i,by+j);px(bx+off+i,by-16+j,h<.3?'#54402A':'#6E5138');}
  }
  const blobs=[[4,-42,52,17],[-26,-32,34,14],[36,-31,34,14],[4,-27,60,16],[-10,-18,42,13],[22,-17,42,13]];
  for(let j=-62;j<-8;j++)for(let i=-58;i<66;i++){
    let inside=false;
    for(const[ox,oy,rx,ry]of blobs){const dx=(i-ox)/rx,dy=(j-oy)/ry;if(dx*dx+dy*dy<1){inside=true;break;}}
    if(!inside) continue;
    const h=hash(bx+i,by+j);
    if(h>.97&&j>-20) continue;
    let col=h<.32?'#2E5227':(h<.62?'#3F6A33':(h<.86?'#548440':'#66984E'));
    if(j<-46) col=h<.5?'#66984E':'#548440';
    if(j>-16) col=h<.6?'#2E5227':'#3F6A33';
    px(bx+i,by+j,col);
  }
  for(const rx of [-30,-12,20,42]){const len=7+((rx*7)%5+5)%5;for(let j=0;j<len;j++)px(bx+rx,by-16+j,'#5E482E');}
}
function shrine(bx,by){
  g.fillStyle='rgba(20,16,8,0.25)';
  g.beginPath();g.ellipse(bx+6,by+2,10,3,0,0,7);g.fill();
  for(let j=0;j<8;j++)for(let i=0;i<12;i++){
    const h=hash(bx+i,by+j);px(bx+i,by-6+j,h<.2?'#D8D2C2':'#EDE8DA');
  }
  for(let j=0;j<7;j++){const w=12-j;for(let i=0;i<w;i++)px(bx+(12-w)/2+i,by-13+j,j%2?'#C05B3B':'#D08A3E');}
  px(bx+5,by-15,'#D08A3E');px(bx+6,by-15,'#D08A3E');px(bx+5,by-16,'#C05B3B');
  g.fillStyle='#3A2A1C';g.fillRect(bx+4,by-3,4,5);
}
function actorDraw(img,cx,groundY,flip){
  g.fillStyle='rgba(20,16,8,0.30)';
  g.beginPath();g.ellipse(cx,groundY,img.width/4+2,3,0,0,7);g.fill();
  if(flip){g.save();g.translate(cx,0);g.scale(-1,1);g.drawImage(img,-img.width/2,groundY-img.height+3);g.restore();}
  else g.drawImage(img,cx-img.width/2,groundY-img.height+3);
}

// ---------- playback ----------
let F=0, playing=false, speed=9;
const scrub=document.getElementById('scrub');
scrub.max=FRAMES.length-1;
const lastPos={}, hit=[];
function frameAt(i){return FRAMES[Math.max(0,Math.min(FRAMES.length-1,i))];}
function lightFor(tick){
  if(tick<3) return ['rgba(10,18,44,0.52)',1];
  if(tick===3) return ['rgba(30,30,60,0.30)',0.6];
  if(tick===4) return ['rgba(255,190,120,0.12)',0];
  if(tick<9) return [null,0];
  if(tick===9||tick===10) return ['rgba(226,120,44,0.18)',0];
  return ['rgba(16,22,48,0.42)',1];
}

function draw(){
  const i0=Math.floor(F), i1=Math.min(i0+1,FRAMES.length-1), fr=F-i0;
  const f0=frameAt(i0), f1=frameAt(i1);
  const tid=f0.t, tick=tid%TPD, day=Math.floor(tid/TPD);
  const [overlay,glow]=lightFor(tick);
  nightGlow=glow;
  g.fillStyle=glow>0.4?'#12140E':'#23261C';
  g.fillRect(0,0,WW,WH);
  drawGround(F*0.12,tid);
  doors.length=0; hit.length=0;

  const items=[];
  META.homes.forEach((h,ix)=>items.push({d:h[1]+h[0]+0.4, f:()=>house(isoX(h[0],h[1])-21,isoY(h[0],h[1])-14,{thatch:ix%2===1,doorRight:ix%3===1,w:ix%2?36:42})}));
  const drawn=new Set(META.homes.map(h=>h[0]+','+h[1]));
  builtAt.forEach(([bt,site],ix)=>{
    const key=site[0]+','+site[1];
    if(bt<=tid&&!drawn.has(key)){
      drawn.add(key);
      items.push({d:site[1]+site[0]+0.4, f:()=>house(isoX(site[0],site[1])-19,isoY(site[0],site[1])-14,{thatch:true,w:36,doorRight:ix%2===0})});
    }
  });
  items.push({d:META.banyan[1]+META.banyan[0]+0.4, f:()=>banyan(isoX(META.banyan[0],META.banyan[1])-4,isoY(META.banyan[0],META.banyan[1])-4)});
  if(META.shrine) items.push({d:META.shrine[1]+META.shrine[0]+0.3, f:()=>shrine(isoX(META.shrine[0],META.shrine[1])-6,isoY(META.shrine[0],META.shrine[1])+6)});

  // cows wander the grazing common, heads mostly down; hens peck in the courtyard
  const [gc,gr]=META.graze;
  for(let k=0;k<3;k++){
    const ph=F*0.006+k*2.1;
    const c=gc-1+k*1.9+Math.sin(ph)*1.1;
    const r=gr+0.7+Math.cos(ph*0.8+k)*0.45;
    const headDown=Math.floor(F*0.03+k)%3!==0;
    const flip=Math.cos(ph)<0;
    items.push({d:r+c, f:()=>actorDraw(cows[k][headDown?1:0],isoX(c,r),isoY(c,r)+TH/2,flip)});
  }
  for(let k=0;k<3;k++){
    const hc=5.2+k*1.3+Math.sin(F*0.05+k*3)*0.4, hr=8.6+Math.cos(F*0.04+k*2)*0.4;
    const hop=Math.floor(F*0.6+k)%7===0?-2:0;
    items.push({d:hr+hc, f:()=>{
      const x=isoX(hc,hr), y=isoY(hc,hr)+TH/2;
      g.fillStyle='rgba(20,16,8,0.25)';g.beginPath();g.ellipse(x,y,4,2,0,0,7);g.fill();
      g.drawImage(henImg,x-henImg.width/2,y-henImg.height+2+hop);
    }});
  }

  const a1={}; f1.agents.forEach(a=>a1[a.id]=a);
  for(const a of f0.agents){
    if(!a.alive) continue;
    const b=a1[a.id]&&a1[a.id].alive?a1[a.id]:a;
    let c=a.x+(b.x-a.x)*fr, r=a.y+(b.y-a.y)*fr;
    if(['socialising','celebrating','praying','playing','fetching_water','herding','foraging'].includes(a.act)&&a.act===((a1[a.id]||a).act)){
      const hs=parseInt(a.id.slice(1),10)+1;
      c+=(hash(hs,7)-0.5)*1.6; r+=(hash(7,hs)-0.5)*1.2;
    }
    if(a.act==='sleeping'||a.act==='sheltering'||a.act==='resting'){lastPos[a.id]=[c,r];continue;}
    const kit=KITS[a.id];
    const isChild=bornAt[a.id]!==undefined&&tid<bornAt[a.id]+ADULT_TICKS;
    let img;
    if(isChild) img=childImg;
    else if(a.act==='farming'||a.act==='foraging') img=(Math.floor(F*0.5)%2)?kit.bent:kit.stand;
    else if(a.act==='walking') img=(Math.floor(F*2)%2)?kit.walk:kit.stand;
    else img=kit.stand;
    const lp=lastPos[a.id]||[c,r];
    const flip=(c-lp[0])<-0.01||(a.dx!==null&&a.dx<a.x);
    lastPos[a.id]=[c,r];
    items.push({d:r+c, f:()=>{
      const x=isoX(c,r), y=isoY(c,r)+TH/2;
      actorDraw(img,x,y,flip);
      hit.push([x,y-img.height/2,a.id]);
    }});
  }
  items.sort((p,q)=>p.d-q.d);
  for(const it of items) it.f();

  const raining=rainDays.has(day)&&tick>=3;
  if(raining){
    g.fillStyle='rgba(70,84,104,0.20)';g.fillRect(0,0,WW,WH);
    g.strokeStyle='rgba(200,214,232,0.35)';g.lineWidth=1;g.beginPath();
    const off=Math.floor(F*22);
    for(let k=0;k<130;k++){
      const rx=(k*97+off*3)%WW, ry=((k*61)+off*7)%WH;
      g.moveTo(rx,ry);g.lineTo(rx-2,ry+7);
    }
    g.stroke();
  }
  if(overlay){g.fillStyle=overlay;g.fillRect(0,0,WW,WH);}
  if(glow>0.4){
    for(const d of doors){
      const grd=g.createRadialGradient(d[0],d[1],2,d[0],d[1],30);
      grd.addColorStop(0,'rgba(255,200,110,0.38)');grd.addColorStop(1,'rgba(255,200,110,0)');
      g.fillStyle=grd;g.fillRect(d[0]-30,d[1]-30,60,60);
    }
  }
  if(selId){
    const h=hit.find(h=>h[2]===selId);
    if(h){
      g.font='10px monospace';
      const nm=NAMES[selId]||selId, w2=g.measureText(nm).width+8;
      g.fillStyle='rgba(20,24,16,0.88)';g.fillRect(h[0]-w2/2,h[1]-26,w2,12);
      g.fillStyle='#F2EFDF';g.fillText(nm,h[0]-w2/2+4,h[1]-17);
    }
  }

  const year=Math.floor(day/DPY)+1;
  document.getElementById('clock').textContent='year '+year+' · day '+(day%DPY+1)+' · '+
    (tick<3?'night':tick<5?'morning':tick<9?'midday':'evening');
  document.getElementById('season').textContent=SEASONS[day%DPY][0]+(raining?' · rain':'');
  document.getElementById('pop').textContent=f0.agents.filter(a=>a.alive).length+' villagers';
  scrub.value=i0;
  updateToast(tid);
  updateCard(tid);
}

// ---------- toast ----------
let toastAt=-1, toastShownAt=0;
function evLine(e){
  const n=id=>NAMES[id]||id;
  switch(e.type){
    case 'founded': return 'Dekot is founded — '+e.population+' villagers by the river';
    case 'dispute': return n(e.challenger)+' challenges '+n(e.holder)+' for the good plot — '+(e.outcome==='challenger_wins'?n(e.challenger)+' takes it':n(e.holder)+' holds');
    case 'plot_claimed': return n(e.agent)+' claims the vacant good plot';
    case 'plot_cleared': return n(e.agent)+' clears new farmland';
    case 'gift': return n(e.giver)+' shares rice with hungry '+n(e.taker);
    case 'refused_food': return n(e.asked)+' turns '+n(e.agent)+' away hungry';
    case 'death': return n(e.agent)+' dies of '+e.cause+', aged '+Math.round(e.age);
    case 'paired': return n(e.a)+' and '+n(e.b)+' marry';
    case 'house_built': return n(e.a)+' and '+n(e.b)+' build a house of their own';
    case 'birth': return e.name+' is born to '+e.parents.map(n).join(' and ');
    case 'came_of_age': return n(e.agent)+' comes of age and takes up farming';
    case 'festival': return 'Festival day — the village gathers under the banyan';
    case 'stopped': return 'Twenty years have passed in Dekot';
  }
  return e.type;
}
function updateToast(tid){
  let last=null;
  for(const [t,e] of FEED){ if(t<=tid) last=[t,e]; else break; }
  const el=document.getElementById('toast');
  if(!last){el.classList.add('fade');return;}
  if(last[0]!==toastAt){
    toastAt=last[0]; toastShownAt=F;
    el.textContent=evLine(last[1]);
    el.classList.toggle('hot',last[1].type==='death');
    el.classList.remove('fade');
  } else if(F-toastShownAt>TPD*2.5){
    el.classList.add('fade');
  }
}

// ---------- tap card ----------
let selId=null;
const card=document.getElementById('card');
function updateCard(tid){
  if(!selId){card.hidden=true;return;}
  const m=META.agents.find(a=>a.id===selId);
  const hist=dayEnd[selId]||[];
  let snap=null;
  for(const s of hist){ if(s[0]<=tid) snap=s; else break; }
  const fa=frameAt(Math.floor(F)).agents.find(a=>a.id===selId);
  let html='<span class="x" id="cx">&times;</span><b>'+m.name+'</b><br>';
  if(fa&&fa.alive){
    html+=(fa.act||'').replace('_',' ')+(snap?(' · health '+Math.round(snap[1])+' · rice '+snap[2]+' · age '+Math.round(snap[4])):'');
  }else html+='no longer living';
  if(m.parents) html+='<br>child of '+m.parents.map(id=>NAMES[id]||id).join(' & ');
  card.innerHTML=html; card.hidden=false;
  document.getElementById('cx').onclick=()=>{selId=null;card.hidden=true;};
}

// ---------- view ----------
const view={x:0,y:0,s:1.8};
function fitView(){
  const r=stage.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,3);
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  view.s=Math.max(cv.width/WW,cv.height/WH)*1.22;
  const cxw=isoX(8.5,7.5), cyw=isoY(8.5,7.5);
  view.x=cv.width/2-cxw*view.s; view.y=cv.height/2-cyw*view.s;
}
function clampView(){
  const minS=Math.max(cv.width/WW,cv.height/WH)*0.9, maxS=minS*6;
  view.s=Math.max(minS,Math.min(maxS,view.s));
  view.x=Math.min(cv.width*0.6,Math.max(cv.width*0.4-WW*view.s,view.x));
  view.y=Math.min(cv.height*0.6,Math.max(cv.height*0.4-WH*view.s,view.y));
}
function present(){
  vg.imageSmoothingEnabled=false;
  vg.fillStyle=nightGlow>0.4?'#12140E':'#23261C';
  vg.fillRect(0,0,cv.width,cv.height);
  vg.drawImage(world,0,0,WW,WH,view.x,view.y,WW*view.s,WH*view.s);
}
const ptrs=new Map(); let lastPinch=null, downAt=null;
stage.addEventListener('pointerdown',e=>{
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1) downAt=[e.clientX,e.clientY];
  lastPinch=null;
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  const dpr=cv.width/stage.getBoundingClientRect().width;
  if(ptrs.size===1){view.x+=(e.clientX-prev[0])*dpr;view.y+=(e.clientY-prev[1])*dpr;clampView();}
  else if(ptrs.size===2){
    const [p1,p2]=[...ptrs.values()];
    const distNow=Math.hypot(p1[0]-p2[0],p1[1]-p2[1]);
    const mid=[(p1[0]+p2[0])/2*dpr,(p1[1]+p2[1])/2*dpr];
    if(lastPinch){
      const k=distNow/lastPinch;
      view.x=mid[0]-(mid[0]-view.x)*k; view.y=mid[1]-(mid[1]-view.y)*k; view.s*=k; clampView();
    }
    lastPinch=distNow;
  }
});
function endPtr(e){
  if(downAt&&ptrs.size===1){
    const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);
    if(moved<8) tap(e);
  }
  ptrs.delete(e.pointerId); lastPinch=null; if(!ptrs.size) downAt=null;
}
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=stage.getBoundingClientRect(), dpr=cv.width/rect.width;
  const mx=(e.clientX-rect.left)*dpr, my=(e.clientY-rect.top)*dpr;
  const k=e.deltaY<0?1.15:0.87;
  view.x=mx-(mx-view.x)*k; view.y=my-(my-view.y)*k; view.s*=k; clampView();
},{passive:false});
function tap(e){
  const rect=stage.getBoundingClientRect(), dpr=cv.width/rect.width;
  const x=((e.clientX-rect.left)*dpr-view.x)/view.s, y=((e.clientY-rect.top)*dpr-view.y)/view.s;
  let best=null,bd=650;
  for(const [hx,hy,id] of hit){
    const d=(hx-x)*(hx-x)+(hy-y)*(hy-y);
    if(d<bd){bd=d;best=id;}
  }
  selId=best;
  if(!best) card.hidden=true;
}

// ---------- controls ----------
const playBtn=document.getElementById('play');
function setPlaying(p){playing=p;playBtn.innerHTML=p?'&#10073;&#10073;':'&#9654;';}
playBtn.addEventListener('click',()=>{
  if(!playing&&F>=FRAMES.length-1.01)F=0;
  setPlaying(!playing);
});
document.getElementById('speed').addEventListener('change',e=>{speed=+e.target.value;});
scrub.addEventListener('input',()=>{F=+scrub.value;setPlaying(false);draw();});

let prev=performance.now(), acc=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now){
  const dt=Math.min((now-prev)/1000,0.25); prev=now;
  if(playing&&!document.hidden){
    F+=speed*dt*(reduced?0.4:1);
    if(F>=FRAMES.length-1){F=FRAMES.length-1;setPlaying(false);}
  }
  acc+=dt;
  if(acc>0.08){acc=0;draw();}
  present();
  requestAnimationFrame(loop);
}
addEventListener('resize',fitView);
{const m=location.hash.match(/t=(\d+)/); if(m) F=Math.min(+m[1],FRAMES.length-1);}
fitView(); draw(); setPlaying(true); requestAnimationFrame(loop);
</script>
